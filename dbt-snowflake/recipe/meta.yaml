{% set name = "dbt-snowflake" %}
{% set version = "1.11.5d" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python 3.11.*
    - setuptools
    - hatchling
  run:
    # via Grayskull
    - python >=3.10.0
    - dbt-common >=1.10,<2.0
    - dbt-adapters >=1.22.6,<2.0
    - snowflake-connector-python >=4.2.0,<5.0.0
    - certifi <2025.4.26
    - dbt-core >=1.11.6,<2.0
    - agate

test:
  imports:
    - dbt.adapters.snowflake
  commands:
    - pip check
  requires:
    - pip
    - python 3.11.*

about:
  home: https://github.com/dbt-labs/dbt-snowflake
  summary: The Snowflake adapter plugin for dbt
